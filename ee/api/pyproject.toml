[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looksee-ee"
version = "0.2.0"
license = "LicenseRef-Enterprise"
authors = [
    { name = "Vlad Svidskiy" },
    { name = "Alexey Pereslytskikh" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "looksee-api",
    "pydantic>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ee"]

[tool.uv.sources]
looksee-api = { workspace = true }
