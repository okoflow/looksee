name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Primary keys default to uuidv7(), a native function from PostgreSQL 18 on.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: looksee
          POSTGRES_PASSWORD: looksee
          POSTGRES_DB: looksee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looksee -d looksee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://looksee:looksee@localhost:5432/looksee
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://looksee:looksee@localhost:5432/looksee
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-packages --extra cpu --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Apply migrations
        run: uv run --package looksee-api alembic -c apps/api/alembic.ini upgrade head

      - name: Migrations match the ORM
        run: uv run --package looksee-api alembic -c apps/api/alembic.ini check

  studio:
    name: Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/studio

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/studio/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture lint
        run: pnpm lint:fsd

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Compose file resolves
        run: docker compose --env-file .env.example config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-check
          MTX_MEDIA_PASSWORD: ci-config-check
          STORAGE_PASSWORD: ci-config-check
