# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://looksee:looksee@localhost:5432/looksee
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://looksee:looksee@localhost:5432/looksee
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-packages --extra cpu --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

      - name: Apply migrations
        run: uv run --package looksee-api alembic -c apps/api/alembic.ini upgrade head

      - name: Migrations match the ORM
        run: uv run --package looksee-api alembic -c apps/api/alembic.ini check

    timeout-minutes: 20

    services:
      # Primary keys default to uuidv7(), a native function from PostgreSQL 18 on.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: looksee
          POSTGRES_PASSWORD: looksee
          POSTGRES_DB: looksee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looksee -d looksee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/studio/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture lint
        run: pnpm lint:fsd

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

    timeout-minutes: 20

  compose:
    name: Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose file resolves
        run: docker compose --env-file .env.example config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-check
          MTX_MEDIA_PASSWORD: ci-config-check
          STORAGE_PASSWORD: ci-config-check

    timeout-minutes: 5

permissions:
  contents: read
