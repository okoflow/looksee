name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      # uuidv7() is a native function from Postgres 18 on, and every primary key
      # defaults to it — an older image fails the migration, not the check.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: looksee
          POSTGRES_PASSWORD: looksee
          POSTGRES_DB: looksee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looksee -d looksee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-packages --extra cpu --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      # `alembic check` compares the ORM against a database already at head, so
      # the squashed migration has to run first. That ordering also proves 0001
      # still applies to an empty volume, which is the only way it ships.
      - name: Apply migrations
        run: uv run --package looksee-api alembic -c apps/api/alembic.ini upgrade head

      - name: Migrations match the ORM
        run: uv run --package looksee-api alembic -c apps/api/alembic.ini check

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/studio/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compose file resolves
        run: docker compose --env-file .env.example config --quiet
