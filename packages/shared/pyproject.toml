[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looksee-shared"
version = "0.2.0"
license = "Apache-2.0"
authors = [
    { name = "Vlad Svidskiy" },
    { name = "Alexey Pereslytskikh" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
