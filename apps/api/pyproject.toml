[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looksee-api"
version = "0.1.0"
license = "Apache-2.0"
authors = [
    { name = "Vlad Svidskiy" },
    { name = "Alexey Pereslytskikh" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomqtt>=2.5.1",
    "aiosmtplib>=5.1.2",
    "alembic",
    "asyncpg",
    "boto3>=1.43.58",
    "botocore>=1.43.56",
    "cryptography>=46",
    "fastapi",
    "faststream[redis]",
    "httpx",
    "pillow>=12.2.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings",
    "pyjwt>=2.10",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "looksee-shared",
    "sqlalchemy[asyncio]",
    "tzdata",
    "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
looksee-shared = { workspace = true }
